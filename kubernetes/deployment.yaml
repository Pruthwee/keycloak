apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          env:
            - name: KC_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: http_port
            - name: KC_HTTP_MANAGEMENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: management_port
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_HOST
              value: "0.0.0.0"
            - name: KC_HTTP_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: KC_DB
              value: "dev-file"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-password
            - name: KC_DB_URL_HOST
              value: "{{DB_HOST}}"
            - name: KC_DB_URL_DATABASE
              value: "{{DB_DATABASE}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
