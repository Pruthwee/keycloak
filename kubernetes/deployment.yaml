apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-keycloak-mm1
  namespace: bedrock-keycloak-mm1
  labels:
    app: bedrock-keycloak-mm1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bedrock-keycloak-mm1
  template:
    metadata:
      labels:
        app: bedrock-keycloak-mm1
    spec:
      containers:
        - name: bedrock-keycloak-mm1
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            - name: KC_DB
              value: "{{KC_DB}}"
            - name: KC_DB_URL_HOST
              value: "{{DB_HOST}}"
            - name: KC_DB_URL_PORT
              value: "{{DB_PORT}}"
            - name: KC_DB_URL_DATABASE
              value: "{{DB_NAME}}"
            - name: KC_DB_USERNAME
              value: "{{DB_USERNAME}}"
            - name: KC_HOSTNAME
              value: "{{KC_HOSTNAME}}"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedrock-keycloak-mm1-secrets
                  key: KC_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bedrock-keycloak-mm1-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedrock-keycloak-mm1-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_JGROUPS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedrock-keycloak-mm1-secrets
                  key: KC_JGROUPS_KEY_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
