apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedrock-keycloak-mm1-ingress
  namespace: bedrock-keycloak-mm1
  labels:
    app: bedrock-keycloak-mm1
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
spec:
  rules:
    - host: bedrock-keycloak-mm1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bedrock-keycloak-mm1-service
                port:
                  number: 80
